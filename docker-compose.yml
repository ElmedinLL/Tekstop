# TechVault stack: SQL Server, .NET API, React SPA (Nginx + /api proxy)
#
# NOTE: The API project in ./TechVault.API is configured for Microsoft SQL Server (local or hosted).
# This compose file still provisions MySQL for historical/docker workflows. To run the API in Docker
# against SQL Server, replace the mysql service + ConnectionStrings__DefaultConnection with a SQL Server
# connection string (or use host networking to reach SQL Server on the host).
#
# Usage:
#   1. Copy .env.example → .env and set secrets (especially MSSQL_SA_PASSWORD, JWT_SECRET).
#      SA password must meet SQL Server policy (length, upper/lower/digit/symbol).
#   2. docker compose up -d --build
#   3. Apply EF migrations from the host (.NET SDK), pointing at the exposed SQL Server port:
#        dotnet ef database update --project TechVault.API/TechVault.API.csproj --context ApplicationDbContext ^
#          --connection "Server=127.0.0.1,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=YOUR_SA_PASSWORD;TrustServerCertificate=True;MultipleActiveResultSets=True"
#        dotnet ef database update --project TechVault.API/TechVault.API.csproj --context AuthDbContext ^
#          --connection "Server=127.0.0.1,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=YOUR_SA_PASSWORD;TrustServerCertificate=True;MultipleActiveResultSets=True"
#
# URLs (default ports):
#   - Frontend:     http://localhost
#   - API + Swagger http://localhost:5000/swagger  (Development env only shows Swagger)
#   - SQL Server:   localhost:1433

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techvault-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - techvault_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ./TechVault.API
      dockerfile: Dockerfile
    container_name: techvault-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver;
        Database=${MSSQL_DATABASE:-techvault};
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        TrustServerCertificate=True;
        MultipleActiveResultSets=True;
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}
      Jwt__Issuer: ${JWT_ISSUER:-TechVault}
      Jwt__Audience: ${JWT_AUDIENCE:-TechVault.API}
      Jwt__ExpiryInDays: ${JWT_EXPIRY_DAYS:-7}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://127.0.0.1}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2:-http://localhost:5173}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__Currency: ${STRIPE_CURRENCY:-usd}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UserName: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-TechVault}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      IdentitySeed__AdminEmail: ${ADMIN_EMAIL:-}
      IdentitySeed__AdminPassword: ${ADMIN_PASSWORD:-}
      IdentitySeed__AdminFirstName: ${ADMIN_FIRST_NAME:-System}
      IdentitySeed__AdminLastName: ${ADMIN_LAST_NAME:-Admin}

  web:
    build:
      context: ./techvault-client
      dockerfile: Dockerfile
    container_name: techvault-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  techvault_sqlserver_data:
